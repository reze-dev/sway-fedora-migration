# ==========================================
# tmux-sensible (load before other settings)
# ==========================================
run-shell "$HOME/.tmux/plugins/tmux-sensible/sensible.tmux"

# ==========================================
# General settings
# ==========================================

set -g default-terminal "xterm-256color"
set -g default-shell "/usr/bin/fish"

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -s escape-time 10

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on
set -g focus-events on

set -g status-keys vi
set -g mode-keys vi

# Automatically create or attach to session 0
new-session -A -s 0

# ==========================================
# Terminal capabilities
# ==========================================

set-option -sa terminal-overrides ",xterm*:Tc"

# ==========================================
# Pane navigation
# ==========================================

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes using Alt + arrow keys
bind -n M-Left  resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up    resize-pane -U 5
bind -n M-Down  resize-pane -D 5

# ==========================================
# Window navigation
# ==========================================

# Shift + arrow keys
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift + Alt + Vim keys
bind -n M-H previous-window
bind -n M-L next-window

# ==========================================
# Pane and window creation
# ==========================================

# Keep the current working directory
bind '"' split-window -v -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"

# ==========================================
# Disable kill confirmation prompts
# ==========================================

bind-key -N "Kill the current window" & kill-window
bind-key -N "Kill the current pane" x kill-pane

# ==========================================
# Plugins (TPM)
# ==========================================

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# PowerKit
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_plugins "datetime,battery,cpu,memory,git"
set -g @powerkit_theme "hackerman"
set -g @powerkit_theme_variant "default"
set -g @powerkit_elements_spacing "both"
set -g @powerkit_status_interval "5"

# Vim-Tmux Navigator
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left "C-h"
set -g @vim_navigator_mapping_right "C-l"
set -g @vim_navigator_mapping_up "C-k"
set -g @vim_navigator_mapping_down "C-j"
set -g @vim_navigator_mapping_prev ""

# Online status
set -g @plugin 'tmux-plugins/tmux-online-status'
set -g @online_icon "ok"
set -g @offline_icon "nok"

# ==========================================
# TPM initialization (keep this at the bottom)
# ==========================================

run '$HOME/.tmux/plugins/tpm/tpm'
