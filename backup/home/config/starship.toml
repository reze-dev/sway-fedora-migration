# Minimal Starship configuration
# Nerd Font glyphs are used for the prompt icons.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = false

format = """\
$nix_shell\
$cmd_duration\
$username\
$hostname\
$character"""

right_format = """\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$golang\
$rust\
$python\
$haskell\
$lua\
$java\
$kotlin\
$nodejs\
$deno\
$zig\
$xmake\
$time"""

[character]
success_symbol = "[λ](bold green)"
error_symbol = "[λ](bold red)"
vimcmd_symbol = "[λ](bold yellow)"

[nix_shell]
symbol = " "
style = "bold blue"
format = "[$symbol$name]($style) "

[cmd_duration]
min_time = 2_000
format = "[󱎫 $duration](dimmed white) "

[username]
style_user = "bold yellow"
style_root = "bold red"
format = "[ $user]($style) "
show_always = false

[hostname]
ssh_only = true
format = "[@$hostname](bold green) "
ssh_symbol = " "

[directory]
home_symbol = "~"
read_only = " "
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "
truncation_length = 24
truncation_symbol = "…"

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = "󰏗 "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[c]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold blue"

[cpp]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold blue"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold cyan"

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold red"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"

[haskell]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold purple"

[lua]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold blue"

[java]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold red"

[kotlin]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold purple"

[deno]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"

[zig]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold yellow"

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "bold green"
detect_files = ["package.json", "package-lock.json", "yarn.lock", "pnpm-lock.yaml"]
detect_folders = ["node_modules"]
detect_extensions = []

[xmake]
symbol = "󰙨 "
format = "[$symbol$version]($style) "
style = "bold cyan"

[time]
disabled = false
time_format = "%R"
style = "dimmed white"
format = "[ $time]($style)"
